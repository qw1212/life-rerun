services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: life-rerun-server
    ports:
      - "3001:3001"
    env_file:
      - .env
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: life-rerun-web
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
